upload_max_filesize = 64M
post_max_size = 80M
memory_limit = 256M
max_execution_time = 300
max_input_vars = 5000
date.timezone = Asia/Makassar

; Security hardening
expose_php = Off
display_errors = Off
log_errors = On

; Production log hardening
; Hide non-critical PHP warnings/notices such as optional ORCID field warning
error_reporting = E_ALL
max_input_time = 300

; PHP session hardening
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
zend.exception_ignore_args = 1
